<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="signup-card">
      <h1 class="title">Create Account</h1>
      <p class="subtitle">Get started with your account</p>

      <form class="signup-form">
        <div class="input-group">
          <input type="text" id="signup-name" placeholder=" " required />
          <label for="signup-name">Name</label>
          <i class="fas fa-user input-icon"></i>
        </div>

        <div class="input-group">
          <input type="email" id="signup-email" placeholder=" " required />
          <label for="signup-email">Email</label>
          <i class="fas fa-envelope input-icon"></i>
        </div>

        <div class="input-group">
          <input type="password" id="signup-password" placeholder=" " required />
          <label for="signup-password">Password</label>
          <i class="fas fa-lock input-icon"></i>
          <i class="fas fa-eye password-toggle"></i>
        </div>

        <button type="button" class="btn btn-primary" onclick="signup()">Sign Up</button>

        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-text">OR</span>
            <span class="divider-line"></span>
          </div>

          <button type="button" class="btn btn-google" onclick="googleLogin()">
            <i class="fab fa-google"></i> Sign up with Google
          </button>
      </form>

      <p class="signup-link">Already have an account? <a href="index.html">Login</a></p>
    </div>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
